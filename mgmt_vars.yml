# Management protocol settings for Lab 4.
# Each section is used by one tag of play_config_mgmt.yml. Edit a section, then run the play with that tag.

# Address of the workstation (the VM) as seen from the devices on the management network.
nms_ip: 172.20.20.1

# Tag: ntp
ntp_server: "{{ nms_ip }}"
timezone: Canada/Atlantic

# Tag: snmpv2
snmp_ro: dcread
snmp_rw: dcwrite
snmp_location: Data Centre
snmp_contact: Group-XX            # replace with your group number
snmp_trap_community: student
snmp_traps_enabled: true

# Tag: snmpv3
snmp_v3_group: GroupXX            # replace with your group name or number
snmp_v3_user: student
snmp_v3_auth_password: Meilab123
snmp_v3_priv_password: Meilab123

# Tag: syslog
syslog_server: "{{ nms_ip }}"
syslog_level: informational
