---
# Configures the management protocols on all devices from mgmt_vars.yml.
# Usage:
#   ansible-playbook -i ../topology/hosts.yml play_config_mgmt.yml --tags ntp
#   (tags: ntp, snmpv2, snmpv3, syslog; no tag runs everything)
# The configuration is saved when it changes.

- name: Configure management protocols
  hosts: all
  gather_facts: false
  vars_files:
    - mgmt_vars.yml
  tasks:
    - name: NTP and time zone
      arista.eos.eos_config:
        lines:
          - "clock timezone {{ timezone }}"
          - "ntp server {{ ntp_server }}"
        save_when: modified
      tags: [ntp]

    - name: SNMP version 2c
      arista.eos.eos_config:
        lines:
          - "snmp-server community {{ snmp_ro }} ro"
          - "snmp-server community {{ snmp_rw }} rw"
          - "snmp-server location {{ snmp_location }}"
          - "snmp-server contact {{ snmp_contact }}"
          - "snmp-server host {{ nms_ip }} version 2c {{ snmp_trap_community }}"
        save_when: modified
      tags: [snmpv2]

    - name: SNMP traps
      arista.eos.eos_config:
        lines:
          - "snmp-server enable traps"
        save_when: modified
      when: snmp_traps_enabled | bool
      tags: [snmpv2]

    - name: SNMP version 3
      arista.eos.eos_config:
        lines:
          - "snmp-server group {{ snmp_v3_group }} v3 priv"
          - "snmp-server user {{ snmp_v3_user }} {{ snmp_v3_group }} v3 auth sha {{ snmp_v3_auth_password }} priv aes {{ snmp_v3_priv_password }}"
        save_when: modified
      tags: [snmpv3]

    - name: Syslog
      arista.eos.eos_config:
        lines:
          - "logging host {{ syslog_server }}"
          - "logging trap {{ syslog_level }}"
        save_when: modified
      tags: [syslog]
